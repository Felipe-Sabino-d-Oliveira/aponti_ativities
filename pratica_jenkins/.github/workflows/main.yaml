name: "Main pipeline"

on:
  push:
    branches: [main, developer]

jobs:
  meu-job:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Install dependencies"
        run: npm install

  build-job:
    runs-on: ubuntu-latest
    needs: meu-job
    steps:
      - name: "Run build"
        run: npm run build

  test-job:
    runs-on: ubuntu-latest
    needs: build-job
    steps:
      - name: "Run tests"
        run: npm test